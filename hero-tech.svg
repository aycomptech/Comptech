  <rect x="13" y="13" width="364" height="207" rx="7" fill="#05090c"/>
  <path d="M190 35c-42 22-63 58-63 92 0 50 37 74 81 74 55 0 92-33 92-80 0-45-39-78-110-86z" fill="#12202b"/>
  <path d="M13 220h364l34 25H-20z" fill="url(#metal)" stroke="#4b555b"/>
  <text x="195" y="125" text-anchor="middle" fill="#f1f4f5" font-family="Arial" font-size="24" font-weight="700" letter-spacing="4">COMPTECH</text>
  <text x="195" y="148" text-anchor="middle" fill="#89939a" font-family="Arial" font-size="7" letter-spacing="3">COMPUTER SERVICE</text>
</g>

<!-- smartphone -->
<g transform="translate(530 260) rotate(9)">
  <rect width="95" height="190" rx="16" fill="#161d22" stroke="#89949c" stroke-width="3"/>
  <rect x="8" y="10" width="79" height="170" rx="11" fill="#071019"/>
  <circle cx="48" cy="169" r="3" fill="#5c6b75"/>
  <path d="M15 120c22-50 50-70 70-77v120c-27 6-48-3-70-43z" fill="#122432"/>
