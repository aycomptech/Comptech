  <circle cx="93" cy="42" r="36" fill="#10161a" stroke="#56636c" stroke-width="6"/>
  <circle cx="93" cy="42" r="19" fill="#020405" stroke="#26333b" stroke-width="5"/>
  <circle cx="87" cy="36" r="6" fill="#79b5dc" opacity=".7"/>
