<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Ilustrasi perangkat CompTech">
<defs>
  <radialGradient id="space" cx="55%" cy="55%" r="65%">
    <stop offset="0" stop-color="#183044"/><stop offset=".55" stop-color="#071017"/><stop offset="1" stop-color="#030405"/>
  </radialGradient>
  <radialGradient id="earth" cx="48%" cy="35%" r="65%">
    <stop offset="0" stop-color="#29485e"/><stop offset=".42" stop-color="#102533"/><stop offset="1" stop-color="#020405"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#dfe5e8"/><stop offset=".45" stop-color="#737d84"/><stop offset="1" stop-color="#222a30"/></linearGradient>
  <linearGradient id="darkmetal" x1="0" x2="1"><stop stop-color="#252f36"/><stop offset="1" stop-color="#070a0c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="900" height="600" rx="30" fill="url(#space)"/>
<g opacity=".55" fill="#fff">
  <circle cx="85" cy="95" r="1.3"/><circle cx="150" cy="55" r="1"/><circle cx="245" cy="125" r="1.2"/>
  <circle cx="355" cy="70" r="1"/><circle cx="510" cy="105" r="1.4"/><circle cx="700" cy="70" r="1"/>
  <circle cx="805" cy="140" r="1.3"/><circle cx="755" cy="230" r="1"/><circle cx="610" cy="180" r="1"/>
</g>
<ellipse cx="570" cy="530" rx="480" ry="180" fill="#162b3a" opacity=".8" filter="url(#glow)"/>
<ellipse cx="570" cy="565" rx="500" ry="180" fill="url(#earth)"/>
<path d="M115 500c130-85 235-45 315-20 105 32 190 45 330-30" fill="none" stroke="#7aa8c5" stroke-opacity=".25" stroke-width="3"/>

<!-- laptop -->
